version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # LiveKit's HTTP and WebSocket stack pins these majors; moving ahead of it
    # builds each crate twice. Lift an entry when LiveKit moves.
    ignore:
      - dependency-name: reqwest
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tokio-tungstenite
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tower-http
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Separate groups so a failure in one does not hold back the rest: a
    # LiveKit release can raise the Clang floor in scripts/fetch-clang.sh, and
    # a tree-sitter grammar has to stay within the runtime's ABI range and the
    # version named in docs/evidence-runtime.md.
    groups:
      livekit:
        patterns:
          - "livekit*"
          - "webrtc-sys*"
      tree-sitter:
        patterns:
          - "tree-sitter*"
      rust:
        patterns:
          - "*"
  # The desktop app's own lockfile. Tauri and its plugins are pinned exactly in
  # desktop/Cargo.toml, so they move only when that file is edited on
  # purpose; this keeps everything beneath them current, in one group so the
  # GTK and WebView crates that have to agree move together.
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
